# Lokal ishlab chiqish: PostgreSQL + MedLink API.
#   docker compose up --build
# SMS kodi API logida chiqadi (MEDLINK_ENV=dev).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: medlink
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: medlink
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medlink"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      MEDLINK_ENV: dev
      DATABASE_URL: postgresql://medlink:medlink@postgres:5432/medlink?sslmode=disable
      # Faqat lokal sinov uchun kalitlar — prod'da Secret Manager ishlating.
      MEDLINK_JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      MEDLINK_DATA_KEYS: k1:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      MEDLINK_ACTIVE_KEY_ID: k1
      MEDLINK_ADMIN_PHONES: "+998900000001"

volumes:
  pgdata:
